<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090612"><title>DRUVA AI</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand"><div class="logo">D</div><div><b>DRUVA</b><span> AI</span><small>Create Beyond Imagination</small></div></div><div class="status">● Ready</div></header>
<main><div class="tabs"><button class="tab active">Text → Image</button><button class="tab">Image → Image</button><button class="tab">Image → Video</button></div>
<section class="card"><label>Describe your image</label><textarea id="prompt" placeholder="A cinematic portrait, realistic photography, beautiful lighting..."></textarea>
<div class="row"><div><label>Aspect ratio</label><select id="size"><option value="1024x1024">1:1 Square</option><option value="1024x1536">9:16 Portrait</option><option value="1536x1024">16:9 Landscape</option></select></div><div><label>Quality</label><select disabled><option>Standard</option></select></div></div>
<button id="create">✨ Create with DRUVA AI</button><p id="msg"></p></section>
<section class="card"><div class="head"><b>Preview</b><button id="download" disabled>Download</button></div><div id="preview" class="preview">Your creation will appear here</div></section></main>
<nav><span class="active">Create</span><span>My Creations</span><span>Settings</span></nav><script src="/app.js"></script></body></html>
